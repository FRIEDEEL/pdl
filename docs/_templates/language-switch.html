<nav class="language-switch" aria-label="{{ '页面语言' if docs_language == 'zh' else 'Page language' }}">
  {% if docs_language == 'zh' %}
  <span aria-current="true" lang="zh-CN">中文</span> ·
  <a href="{{ language_url }}" lang="en" hreflang="en">English</a>
  {% else %}
  <span aria-current="true" lang="en">English</span> ·
  <a href="{{ language_url }}" lang="zh-CN" hreflang="zh-CN">{{ '中文文档' if api_english_only else '中文' }}</a>
  {% endif %}
</nav>
{% if api_english_only %}
<p class="language-note">The API reference is available in English only.</p>
{% endif %}
