[project]
name = "pdl"
version = "0.1.0"
description = "Static vector diagrams with native SVG and TikZ output"
readme = "README.md"
authors = [
    { name = "LiGuang", email = "guangli25@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.60",
    "uharfbuzz>=0.50",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
